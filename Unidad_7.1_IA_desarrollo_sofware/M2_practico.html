<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AED III - Evaluación Interactiva: Módulo 2</title>
    <!-- Bibliotecas -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --apple-black: #1d1d1f;
            --apple-gray: #86868b;
            --apple-blue: #0071e3;
            --apple-bg: #f5f5f7;
            --apple-green: #34c759;
            --apple-red: #ff3b30;
            --gemini-gradient: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
            --glass: rgba(255, 255, 255, 0.85);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-black);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Contenedor Principal */
        .quiz-card {
            width: 90%;
            max-width: 850px;
            background: white;
            border-radius: 36px;
            padding: 60px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.08);
            position: relative;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tag {
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--apple-gray);
            display: block;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin: 0;
        }

        /* Barra de Progreso */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e5e5e7;
            border-radius: 10px;
            margin: 30px 0;
            overflow: hidden;
        }

        #progressFill {
            width: 0%;
            height: 100%;
            background: var(--apple-blue);
            transition: width 0.4s ease;
        }

        /* Preguntas */
        .question-area {
            animation: slideIn 0.6s ease-out;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        /* Opciones */
        .options-list {
            display: grid;
            gap: 15px;
        }

        .option-item {
            background: var(--apple-bg);
            padding: 22px 28px;
            border-radius: 20px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-item:hover {
            background: #f0f0f2;
            transform: scale(1.01);
        }

        .option-item.selected {
            border-color: var(--apple-blue);
            background: white;
        }

        .option-item.correct {
            background: #e8f5e9;
            border-color: var(--apple-green);
            color: #1b5e20;
        }

        .option-item.wrong {
            background: #ffebee;
            border-color: var(--apple-red);
            color: #b71c1c;
        }

        /* Feedback y Asistente */
        .tutor-feedback {
            margin-top: 30px;
            padding: 25px;
            border-radius: 24px;
            background: #fbfbfd;
            border-left: 5px solid var(--apple-blue);
            display: none;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .action-btns {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            gap: 20px;
        }

        .btn {
            padding: 18px 36px;
            border-radius: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            font-size: 1rem;
        }

        .btn-next {
            background: var(--apple-black);
            color: white;
            flex-grow: 1;
        }

        .btn-next:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-socratic {
            background: var(--gemini-gradient);
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Final Results */
        .result-screen {
            text-align: center;
            display: none;
        }

        .score-display {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 10px solid var(--apple-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0 auto 40px;
        }

        .sankalpa-quote {
            font-style: italic;
            color: var(--apple-gray);
            margin-top: 40px;
            padding: 30px;
            border-top: 1px solid #eee;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader:after { content: '...'; animation: load 1.5s infinite; }
        @keyframes load { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }

        @media (max-width: 600px) {
            .quiz-card { padding: 30px; }
            .action-btns { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="quiz-card" id="quizCard">
        
        <!-- PANTALLA DE BIENVENIDA -->
        <div id="welcomeScreen">
            <div class="header">
                <span class="tag">Evaluación Módulo 2</span>
                <h1>Arquitectura de Interfaz</h1>
                <p>Valida tu dominio sobre la integración de IA en el IDE, orquestación YAML y protocolos de lenguaje.</p>
            </div>
            
            <div style="text-align: center; margin-top: 50px;">
                <button class="btn btn-next" onclick="initQuiz()">Iniciar Simulación</button>
            </div>
        </div>

        <!-- AREA DE EXAMEN -->
        <div id="examArea" style="display: none;">
            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>
            
            <div id="questionWrapper" class="question-area">
                <!-- Inyectado por JS -->
            </div>
            
            <div class="tutor-feedback" id="tutorFeedback">
                <h4 style="margin: 0 0 10px 0; color: var(--apple-blue);"><i data-lucide="brain-circuit"></i> Análisis Socrático</h4>
                <div id="tutorContent"></div>
            </div>

            <div class="action-btns">
                <button class="btn btn-socratic" id="socraticBtn" onclick="askSocraticTutor()">
                    <i data-lucide="sparkles"></i> Consultar al Tutor
                </button>
                <button class="btn btn-next" id="nextBtn" onclick="handleNext()" disabled>
                    Siguiente Concepto
                </button>
            </div>
        </div>

        <!-- RESULTADOS FINALES -->
        <div id="resultScreen" class="result-screen">
            <span class="tag">Simulación Finalizada</span>
            <h2 id="finalTitle">¡Excelente trabajo técnico!</h2>
            <div class="score-display" id="finalScore">0</div>
            <p id="finalMessage" style="font-size: 1.1rem; max-width: 600px; margin: 0 auto;"></p>
            
            <div class="sankalpa-quote" id="sankalpaMsg"></div>

            <button class="btn btn-next" style="margin-top: 40px;" onclick="location.reload()">Reiniciar Evaluación</button>
        </div>

    </div>

    <script>
        lucide.createIcons();

        // Banco de preguntas del Módulo 2
        const questions = [
            {
                q: "¿Qué función cumple el protocolo LSP (Language Server Protocol) en la integración de la IA?",
                o: [
                    "Gestiona la descarga de modelos desde Ollama.",
                    "Permite al IDE exponer el Árbol Sintáctico (AST) para que la IA comprenda la estructura del código.",
                    "Es el protocolo encargado de cifrar la conexión SSH con la nube.",
                    "Sirve para renderizar diagramas Mermaid automáticamente."
                ],
                c: 1,
                hint: "El LSP es el traductor entre el texto plano y el significado gramatical del lenguaje de programación."
            },
            {
                q: "¿Por qué en la arquitectura de Módulo 2 separamos el modelo de 'Chat' del de 'Autocomplete'?",
                o: [
                    "Para poder usar dos lenguajes de programación distintos.",
                    "Porque el autocompletado requiere latencia mínima (microsegundos) y el chat requiere razonamiento profundo.",
                    "Debido a que VS Code no permite usar el mismo modelo para dos ventanas.",
                    "Para evitar que la IA se confunda entre comentarios y código."
                ],
                c: 1,
                hint: "Se trata de optimizar los Tokens por Segundo (T/s) basándose en la carga de parámetros (1.5B vs 7B)."
            },
            {
                q: "En el archivo config.yaml, ¿qué sección define los inyectores de información externa (archivos, docs, terminal)?",
                o: [
                    "modelProviders",
                    "slashCommands",
                    "contextProviders",
                    "systemInstructions"
                ],
                c: 2,
                hint: "Busca el término que se refiere a los 'proveedores' del entorno donde reside el código."
            },
            {
                q: "Durante el flujo de interacción, ¿qué hace el 'Retrieval Engine' (RAG) local?",
                o: [
                    "Compila el código en tiempo real para buscar errores.",
                    "Busca en el índice vectorial fragmentos de código semánticamente cercanos a la consulta.",
                    "Envía el código a OpenAI para su análisis profundo.",
                    "Elimina los espacios en blanco para ahorrar tokens."
                ],
                c: 1,
                hint: "Es el filtro que evita que enviemos 10.000 líneas de código a un modelo que solo soporta 4.000."
            },
            {
                q: "¿Qué representa el paso de 'Ghost Text' en la arquitectura de la interfaz?",
                o: [
                    "Código que ha sido borrado por error.",
                    "Sugerencias de IA que aparecen en gris antes de ser aceptadas con 'Tab'.",
                    "Líneas de código que no se ejecutan (comentarios).",
                    "Un error de renderizado en el buffer de VS Code."
                ],
                c: 1,
                hint: "Es la visualización asíncrona de la predicción probabilística del modelo."
            }
        ];

        let currentIdx = 0;
        let score = 0;
        const apiKey = ""; // Runtime provided

        function initQuiz() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('examArea').style.display = 'block';
            renderQuestion();
        }

        function renderQuestion() {
            const data = questions[currentIdx];
            const container = document.getElementById('questionWrapper');
            document.getElementById('tutorFeedback').style.display = 'none';
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('progressFill').style.width = `${((currentIdx) / questions.length) * 100}%`;

            container.innerHTML = `
                <span class="tag">Concepto ${currentIdx + 1} de ${questions.length}</span>
                <h2>${data.q}</h2>
                <div class="options-list">
                    ${data.o.map((opt, i) => `
                        <div class="option-item" onclick="selectOption(${i})" id="opt-${i}">
                            ${opt}
                            <i data-lucide="circle" size="18"></i>
                        </div>
                    `).join('')}
                </div>
            `;
            lucide.createIcons();
        }

        function selectOption(idx) {
            const data = questions[currentIdx];
            const options = document.querySelectorAll('.option-item');
            
            // Bloquear otras selecciones
            options.forEach(o => o.style.pointerEvents = 'none');

            if(idx === data.c) {
                document.getElementById(`opt-${idx}`).classList.add('correct');
                score++;
            } else {
                document.getElementById(`opt-${idx}`).classList.add('wrong');
                document.getElementById(`opt-${data.c}`).classList.add('correct');
            }

            document.getElementById('nextBtn').disabled = false;
            if(currentIdx === questions.length - 1) {
                document.getElementById('nextBtn').innerText = "Finalizar y Evaluar";
            }
        }

        function handleNext() {
            currentIdx++;
            if(currentIdx < questions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('examArea').style.display = 'none';
            const screen = document.getElementById('resultScreen');
            screen.style.display = 'block';
            
            const finalScore = Math.round((score / questions.length) * 10);
            document.getElementById('finalScore').innerText = finalScore;

            let msg = "";
            let sankalpa = "";

            if(finalScore >= 8) {
                msg = "Dominio Arquitectónico Superior. Entiendes perfectamente cómo fluye la inteligencia en el entorno de desarrollo.";
                sankalpa = "Tu claridad técnica es el reflejo de una mente en equilibrio. Usa este poder para orquestar soluciones que armonicen la complejidad.";
            } else if(finalScore >= 5) {
                msg = "Nivel Técnico Sólido. Te sugiero repasar la diferencia entre LSP y AST para alcanzar la maestría.";
                sankalpa = "El aprendizaje es una alineación constante. Sigue refinando tu configuración hasta que la técnica sea una extensión natural de tu ser.";
            } else {
                msg = "Requieres fortalecer la base teórica del entorno asíncrono y los Context Providers.";
                sankalpa = "No hay error, solo datos de aprendizaje. Vuelve a la teoría con una mirada de presencia absoluta.";
            }

            document.getElementById('finalMessage').innerText = msg;
            document.getElementById('sankalpaMsg').innerHTML = `
                <p>${sankalpa}</p>
                <p style="margin-top:20px;"><strong>— Prof. Jose Luis Oemig (Sankalpa Online)</strong></p>
            `;
        }

        // INTEGRACIÓN CON GEMINI PARA EL TUTOR SOCRÁTICO
        async function askSocraticTutor() {
            const feedbackArea = document.getElementById('tutorFeedback');
            const feedbackContent = document.getElementById('tutorContent');
            const data = questions[currentIdx];

            feedbackArea.style.display = 'block';
            feedbackContent.innerHTML = '<span class="loader">Iniciando análisis semántico profundo</span>';

            const userPrompt = `Estoy estudiando el Módulo 2 de Algoritmos III. Explícame de forma socrática y técnica el concepto detrás de esta pregunta: "${data.q}". La respuesta clave es "${data.o[data.c]}". No me des la respuesta masticada, guíame para entender la arquitectura del IDE y la IA.`;
            
            const systemPrompt = "Eres Jose Luis Oemig, docente universitario de Ingeniería y experto en Educación. Tu tono es profesional, alentador y técnico. Explica conceptos como LSP, AST o RAG de forma clara.";

            try {
                const response = await callGemini(userPrompt, systemPrompt);
                feedbackContent.innerText = response;
            } catch (error) {
                feedbackContent.innerText = "La conexión con el núcleo de inteligencia ha fallado. Reintenta en unos instantes.";
            }
        }

        async function callGemini(q, s) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: q }] }],
                    systemInstruction: { parts: [{ text: s }] }
                })
            });
            const data = await res.json();
            return data.candidates[0].content.parts[0].text;
        }
    </script>
</body>
</html>
